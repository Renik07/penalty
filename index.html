<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Угадайте исход пяти пенальти и проверьте футбольную интуицию.">
    <title>LEON</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="start-screen" class="start-shell">
      <div class="stadium-glow" aria-hidden="true"></div>
      <section class="start-card" aria-labelledby="game-title">
        <!-- <img class="logo eyebrow" src="images/logo.svg" alt="Leon"> -->
        <!-- <div class="ball-mark" aria-hidden="true">●</div> -->
        <!-- <h1 id="game-title">Ключевой момент</h1> -->
        <!-- <p class="lead">Угадай и получи приз</p> -->
        <button id="start-button" class="primary-button image-button" type="button" aria-label="Начать игру">
          <img src="images/start-button.png" width="978" height="614" alt="">
        </button>
        <!-- <p class="controls-note">Контроллер: кнопка 1 — гол · кнопка 2 — мимо</p> -->
      </section>
    </main>

    <main id="game-screen" class="game-shell hidden">
      <!-- <header class="game-header">
        <img class="logo mini-brand" src="images/logo.svg" alt="Leon" width="80" height="20">
        <div class="round-counter"><strong id="round-number">1</strong><span>/ 5</span></div>
        <div class="live-score">Угадано <strong id="live-score">0</strong></div>
      </header> -->

      <section class="video-stage">
        <video id="game-video" class="game-video" muted playsinline preload="auto"></video>
        <div class="video-vignette" aria-hidden="true"></div>
        <p id="video-name" class="video-name hidden"></p>

        <div id="loading-overlay" class="status-overlay hidden">
          <span class="loader"></span><p>Готовим удар</p>
        </div>

        <div id="playback-overlay" class="status-overlay hidden">
          <button id="play-video-button" class="primary-button" type="button">Запустить видео</button>
        </div>

        <div id="prediction-overlay" class="prediction-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="prediction-title">
          <video id="prediction-video" class="prediction-video" src="source/test-opacity-video.webm" muted loop playsinline preload="auto" aria-hidden="true"></video>
          <!-- <h2 id="prediction-title">ЗАБЬЕТ ИЛИ НЕ ЗАБЬЕТ?</h2> -->
          <div class="prediction-actions">
            <button id="goal-button" class="goal-button" type="button" aria-label="Забьёт">
              <img src="images/goal-button.png" width="849" height="329" alt="">
            </button>
            <button id="miss-button" class="miss-button" type="button" aria-label="Не забьёт">
              <img src="images/miss-button.png" width="900" height="327" alt="">
            </button>
          </div>
          <!-- <p class="controller-status">Работают клавиши 1/2, ←/→ и первые две кнопки геймпада</p> -->
        </div>

        <div id="round-result-overlay" class="result-overlay hidden" role="status">
          <video id="result-video" class="overlay-video" src="source/test-opacity-video.webm" muted loop playsinline preload="auto" aria-hidden="true"></video>
          <!-- <p id="actual-result" class="round-kicker"></p> -->
          <h2 id="round-result-title"></h2>
          <!-- <p id="round-result-copy"></p> -->
          <!-- <p id="result-countdown" class="result-countdown"></p> -->
        </div>
      </section>

      <!-- <footer id="progress-row" class="progress-row" aria-label="Прогресс игры"></footer> -->
    </main>

    <main id="final-screen" class="final-shell hidden">
      <section class="final-card">
        <!-- <p class="eyebrow">Серия завершена</p> -->
        <!-- <div class="final-score"><strong id="final-score">0</strong><span>/ 5</span></div> -->
        <!-- <h1 id="final-title" class="final-title">Серия завершена</h1> -->
        <!-- <p id="final-copy" class="lead"></p> -->
        <div id="result-dots" class="result-dots"></div>
        <button id="home-button" class="setup-button image-button" type="button" aria-label="Начать заново">
          <img src="images/home-button.png" width="816" height="193" alt="">
        </button>
      </section>
    </main>

  </body>
</html>
